schema_version: 1

workflows:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"

# See references/intake.md. `backend` selects which block below is authoritative.
intake:
  backend: "azure-devops"          # azure-devops | slack
  triage_identity: "TRIAGE_IDENTITY"
  allow_source_root_posts: false
  allow_worker_writes: false

  # backend: azure-devops
  azure_devops:
    organization: "example-org"
    project: "Example-Project"
    query: "t:Bug s:New area:Example-Project\\Intake"
    operations_work_item_id: ""

  # backend: slack
  slack:
    source_channel_id: "SOURCE_THREAD"
    operations_channel_id: ""
    read_action: "configured-slack-read-action"
    thread_post_action: "configured-slack-thread-post-action"
    file_download_action: "configured-slack-file-download-action"
    operations_edit_action: "configured-slack-edit-action"
    prefer_mcp_actions: true
    optional_bot_token_env: "BENNY_SLACK_BOT_TOKEN"

repository:
  url: "https://dev.azure.com/example-org/Example-Project/_git/example-repo"
  default_branch: "master"
  pull_request_tool: "repo_pull_request_write"
  pull_request_url_format: "https://dev.azure.com/{org}/{project}/_git/{repo}/pullrequest/{id}"
  draft_only: true

tracker:
  # "intake" reuses the intake backend as the tracker. With backend azure-devops
  # that is the common case and removes all cross-system id mapping.
  type: "intake"
  adapter_skill_name: ""
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "issue report"
  require_compensation_action: true

routing:
  map_path: ".github/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".github/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

# Slugs must exist in pstack's models.default.md panel.
models:
  triage: "gemini-3.1-pro-preview"
  reproduce: "gpt-5.6-sol"
  code: "grok-4.5"
  media_review: "gemini-3.1-pro-preview"

# Copilot workflows are scheduled, not event-triggered. See references/intake.md.
schedule:
  triage_interval: "hourly"
  reproduce_interval: "hourly"
  reports_per_run: 1
