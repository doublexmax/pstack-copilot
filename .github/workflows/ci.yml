name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structural and sync checks
        run: |
          node scripts/check-copilot-port.mjs
          node scripts/check-context-routing.mjs
          node scripts/check-upstream-sync.mjs

      - name: Run test suite
        run: node --test scripts/*.test.mjs
